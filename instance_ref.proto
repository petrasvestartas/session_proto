syntax = "proto3";

package session_proto;

import "xform.proto";
import "color.proto";
import "element.proto";

// InstanceRef message: a block reference that places a definition by a transform
message InstanceRef {
  string guid = 1;              // Unique identifier
  string name = 2;              // Instance name
  string definition_guid = 3;   // Guid of the definition this instance places
  Xform xform = 4;              // Unused inside a Session, where Session.xforms places the instance; identity is not written
  Color color = 5;              // Per-instance color, written only when flags has FLAG_COLOR
  uint32 flags = 6;             // Bits: 1 hidden, 2 locked, 4 color overrides the definition's
  repeated ElementFeature features = 7;  // Per-instance features in the definition frame
}
