syntax = "proto3";

package session_proto;

import "color.proto";
import "point.proto";

// Line message representing a line segment
message Line {
  Point start = 1;    // Start point
  Point end = 2;      // End point
  string guid = 3;    // Unique identifier
  string name = 4;    // Line name
  reserved 5;  // was: Xform xform - transforms now live only on Session
  double width = 6;   // Line width
  Color linecolor = 7; // Line color
  repeated double dash = 8;   // Dash pattern: on/off lengths in mm, repeating; empty = solid
}
