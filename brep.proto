syntax = "proto3";

package session_proto;

import "color.proto";
import "nurbssurface.proto";
import "nurbscurve.proto";
import "point.proto";

// TopAbs_Orientation: carried by the parent -> child reference, never by the shape.
enum BRepOrientation {
  ORIENTATION_FORWARD = 0;
  ORIENTATION_REVERSED = 1;
  ORIENTATION_INTERNAL = 2;
  ORIENTATION_EXTERNAL = 3;
}

// TopoDS_Shape: an oriented reference to a sub-shape (index into the owning table).
message BRepRef {
  int32 index = 1;
  BRepOrientation orientation = 2;
}

// BRep_TVertex
message BRepVertex {
  Point point = 1;
  double tolerance = 2;
}

// BRep_CurveOnSurface / BRep_CurveOnClosedSurface: curve_2d_index_2 is the pcurve of the
// REVERSED use of the edge on a closed surface (seam); -1 otherwise.
message BRepCurveOnSurface {
  int32 surface_index = 1;
  int32 curve_2d_index = 2;
  int32 curve_2d_index_2 = 3;
}

// BRep_TEdge: curve_3d_index is -1 for a degenerated edge (pole/apex).
message BRepEdge {
  int32 curve_3d_index = 1;
  int32 start_vertex = 2;
  int32 end_vertex = 3;
  double tolerance = 4;
  bool degenerated = 5;
  repeated BRepCurveOnSurface pcurves = 6;
}

// TopoDS_TWire
message BRepWire {
  repeated BRepRef edges = 1;
}

// BRep_TFace: the first wire is the outer boundary.
message BRepFace {
  int32 surface_index = 1;
  repeated BRepRef wires = 2;
  double tolerance = 3;
  Color facecolor = 4;
}

// TopoDS_TShell
message BRepShell {
  repeated BRepRef faces = 1;
}

// TopoDS_TSolid
message BRepSolid {
  repeated BRepRef shells = 1;
}

// TopoDS_Compound: the free shapes are those no parent references.
message BRep {
  string guid = 1;
  string name = 2;
  repeated NurbsCurve curves_2d = 3;
  repeated NurbsCurve curves_3d = 4;
  repeated NurbsSurface surfaces = 5;
  repeated BRepVertex vertices = 6;
  repeated BRepEdge edges = 7;
  repeated BRepWire wires = 8;
  repeated BRepFace faces = 9;
  repeated BRepShell shells = 10;
  repeated BRepSolid solids = 11;
  double width = 12;
  Color surfacecolor = 13;
  reserved 14;  // was: Xform xform - transforms now live only on Session
}
