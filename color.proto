syntax = "proto3";

package session_proto;

// Color message with RGBA components
message Color {
  string guid = 1;        // Unique identifier
  float r = 2;            // Red component (0.0-1.0)
  float g = 3;            // Green component (0.0-1.0)
  float b = 4;            // Blue component (0.0-1.0)
  float a = 5;            // Alpha component (0.0-1.0)
  string name = 6;        // Optional color name
}
